<style>
:root{--bg:#f3f3f7;--cd:#fff;--tx:#15151a;--mu:#76767f;--ac:#ff5a1f;--a2:#ff8a3d;--bd:#e4e4ea;--ok:#18a058;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

h2{margin:0;font-size:26px}h3{margin:0 0 6px;font-size:17px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{min-height:44px;min-width:44px;border:0;border-radius:12px;padding:0 14px;background:var(--bd);cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}
.p{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;font-weight:700}.big{width:100%;min-height:54px;font-size:18px}.d{color:#e33}.ic{background:var(--cd);border:1px solid var(--bd);font-size:20px;padding:0}
input,select,textarea{min-height:44px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);padding:0 10px;width:100%;margin:2px 0}textarea{padding:8px;min-height:60px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>.f0{flex:0 0 auto}.mu{color:var(--mu);font-size:13px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g b{font-size:22px;display:block}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;background:none;min-height:38px}.seg .on{background:var(--cd);font-weight:700}
.s{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;margin:6px 0;align-items:center}.s.dn{background:#18a05822;border-radius:12px}
.st{display:flex;align-items:center;gap:2px}.st button{min-width:30px;min-height:40px;padding:0;font-size:18px}.st input{text-align:center;padding:0;min-width:0}
.sp{display:grid;grid-template-columns:70px 1fr 1fr 40px;gap:6px;margin:5px 0}

nav button{flex:1;background:none;border-radius:0;min-height:58px;font-size:11px;color:var(--mu)}nav .on{color:var(--ac);font-weight:700}
#tm{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;border-radius:16px;padding:12px;display:none;text-align:center;font-weight:700;z-index:6}#tm u{padding:8px}
#m{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}.sh{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.it{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal i{font-style:normal;padding:8px 0;border-radius:9px}.cal .w{background:var(--ac);color:#fff;font-weight:700}
.pr{color:var(--ac);font-weight:700}svg{width:100%;height:auto}.tg{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px}

.hero{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;border:0}.hero .mu{color:#ffffffcc}.wb{background:#fff;color:var(--ac);font-weight:700}

:root[data-oled=on]{--bg:#000;--cd:#09090c;--bd:#22222a}nav svg{width:24px;margin:0 auto 2px;display:block}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="v"></main><div id="tm"></div><nav id="nv"></nav><div id="m" onclick="if(event.target==this)X()"></div>
<script>
/* ===== GymTracker v2 — dati solo locali (localStorage), app vuota ===== */
const MU=['Petto','Schiena','Spalle','Bicipiti','Tricipiti','Gambe','Glutei','Polpacci','Core','Avambracci','Altro'];
/* Libreria base OPZIONALE (importabile dalle impostazioni): nome|muscolo */
const BASE=`Panca piana|Petto;Panca inclinata manubri|Petto;Croci ai cavi|Petto;Dip|Petto;Trazioni|Schiena;Lat machine|Schiena;Rematore con bilanciere|Schiena;Rematore con manubrio|Schiena;Pulley|Schiena;Stacco da terra|Schiena;Military press|Spalle;Shoulder press manubri|Spalle;Alzate laterali|Spalle;Face pull|Spalle;Curl con bilanciere|Bicipiti;Curl con manubri|Bicipiti;Curl a martello|Bicipiti;French press|Tricipiti;Push down ai cavi|Tricipiti;Estensioni sopra la testa|Tricipiti;Squat|Gambe;Front squat|Gambe;Leg press|Gambe;Leg extension|Gambe;Leg curl|Gambe;Stacco rumeno|Gambe;Affondi|Gambe;Hack squat|Gambe;Hip thrust|Glutei;Calf in piedi|Polpacci;Calf seduto|Polpacci;Crunch|Core;Plank|Core;Leg raise|Core;Russian twist|Core;Curl inverso|Avambracci`;
const $=s=>document.querySelector(s),K='gymtracker_v2',GG=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,tab='home',seg='plans',selDay=1,pEx='',pMet='w',pPer=30,bMet='kg',calM=new Date(),F={},cb=null,tmpN='';
/* --- Storage (try/catch ovunque, stato vuoto di default) --- */
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(e){db=null}db=db||{plans:[],active:-1,sessions:[],lib:[],body:[],live:null,set:{goal:3,unit:'kg',rest:90,theme:''}}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Salvataggio non riuscito')}}
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wk=d=>{d=new Date(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)},U=()=>db.set.unit,fm=n=>Math.round(n).toLocaleString('it-IT');
const e1=(w,r)=>w*(1+r/30),vol=s=>s.ex.reduce((a,x)=>a+x.sets.reduce((b,y)=>b+(y.d?y.w*y.r:0),0),0),cur=()=>db.plans[db.active];
const sorted=()=>[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),mus=n=>(db.lib.find(x=>x.n==n)||{}).m||'Altro';
const last=n=>{for(const s of sorted()){const x=s.ex.find(x=>x.e==n&&x.sets.some(y=>y.d));if(x)return x.sets.filter(y=>y.d)}return null};
function best(n){let o={w:0,e:0};db.sessions.forEach(s=>s.ex.forEach(x=>{if(x.e==n)x.sets.forEach(y=>{if(y.d&&y.t!='R'){o.w=Math.max(o.w,y.w);o.e=Math.max(o.e,e1(y.w,y.r))}})}));return o}
/* --- UI: modali, toast (niente alert/confirm/prompt: bloccati nei contesti sandbox) --- */
function M(h){$('#m').innerHTML='<div class=sh>'+h+'</div>';$('#m').className='on'}function X(){$('#m').className=''}
function ask(t,f,ok){cb=f;M(`<h3>${t}</h3><br><div class=r><button onclick=X()>Annulla</button><button class="p" onclick="X();cb()">${ok||'Conferma'}</button></div>`)}
function inp(t,f,v){cb=f;M(`<h3>${t}</h3><input id=mi value="${esc(v||'')}" autofocus><br><br><div class=r><button onclick=X()>Annulla</button><button class=p onclick="const v=$('#mi').value.trim();if(v){X();cb(v)}">OK</button></div>`)}
function toast(t){const e=$('#tm');clearInterval(tI);e.style.display='block';e.textContent=t;setTimeout(()=>{if(e.textContent==t)e.style.display='none'},2500)}
function pick(f){cb=f;M(`<h3>Scegli esercizio</h3><input id=q placeholder="Cerca o scrivi il nome di uno nuovo" oninput=pkL()><div id=pl style="max-height:48vh;overflow:auto"></div>`);pkL()}
function pkL(){const q=$('#q').value.toLowerCase().trim(),l=db.lib.map((x,i)=>[x,i]).filter(a=>a[0].n.toLowerCase().includes(q));$('#pl').innerHTML=l.map(a=>`<div class=it onclick="X();cb(db.lib[${a[1]}].n)"><b>${esc(a[0].n)}</b><span class=mu>${a[0].m}</span></div>`).join('')+(q?`<div class=it onclick=pkN()><b class=pr>+ Crea "${esc(q)}"</b></div>`:'')||'<p class=mu>Libreria vuota: scrivi il nome per crearne uno.</p>'}
function pkN(){tmpN=$('#q').value.trim();M(`<h3>Gruppo muscolare di "${esc(tmpN)}"</h3>`+MU.map((m,i)=>`<button style="margin:4px" onclick="nw(${i})">${m}</button>`).join(''))}
function nw(i){db.lib.push({n:tmpN,m:MU[i]});save();X();cb(tmpN)}
/* --- Timer recupero --- */
let tI,tL=0;const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),350)}catch(e){}};
function timer(s){clearInterval(tI);tL=s;const el=$('#tm');el.style.display='block';const dr=()=>el.innerHTML=`⏱ ${Math.floor(tL/60)}:${String(tL%60).padStart(2,'0')} <u onclick="tL=Math.max(1,tL-15)">−15</u><u onclick="tL+=15">+15</u><u onclick="tS()">Salta</u>`;dr();tI=setInterval(()=>{if(--tL<=0){tS();navigator.vibrate&&navigator.vibrate([300,100,300]);beep()}else dr()},1000)}
const tS=()=>{clearInterval(tI);$('#tm').style.display='none'};
/* --- Grafici SVG --- */
function line(p,u){if(p.length<2)return'<div class=em>Servono almeno 2 registrazioni.</div>';const W=320,H=150,y=p.map(a=>a[1]),mn=Math.min(...y),mx=Math.max(...y),s=(mx-mn)||1,X0=i=>34+i*(W-44)/(p.length-1),Y0=v=>H-22-(v-mn)/s*(H-40);return`<svg viewBox="0 0 ${W} ${H}"><g font-size="10" fill="gray"><text x="0" y="${Y0(mx)+4}">${+mx.toFixed(1)}</text><text x="0" y="${Y0(mn)+4}">${+mn.toFixed(1)}</text><text x="34" y="${H-4}">${p[0][0].slice(5)}</text><text x="${W-34}" y="${H-4}">${p.at(-1)[0].slice(5)}</text></g><defs><linearGradient id=gg x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#ff5a1f" stop-opacity=.35 /><stop offset=1 stop-color="#ff5a1f" stop-opacity=0 /></linearGradient></defs><polygon fill="url(#gg)" points="${X0(0)},${H-22} ${p.map((a,i)=>X0(i)+','+Y0(a[1])).join(' ')} ${X0(p.length-1)},${H-22}"/><polyline fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linejoin="round" points="${p.map((a,i)=>X0(i)+','+Y0(a[1])).join(' ')}"/>${p.map((a,i)=>`<circle cx="${X0(i)}" cy="${Y0(a[1])}" r="3.5" fill="#ff5a1f"/>`).join('')}</svg><div class=mu>${u}</div>`}
function bars(d){if(!d.length)return'<div class=em>Nessun dato.</div>';const mx=Math.max(1,...d.map(a=>a[1])),w=300/d.length;return`<svg viewBox="0 0 320 130">${d.map((a,i)=>`<rect x="${10+i*w}" y="${108-a[1]/mx*92}" width="${w-6}" height="${a[1]/mx*92}" rx="4" fill="#ff5a1f"/><text x="${10+i*w}" y="124" font-size="9" fill="gray">${a[0].slice(-5)}</text><text x="${10+i*w}" y="${104-a[1]/mx*92}" font-size="9" fill="gray">${fm(a[1])}</text>`).join('')}</svg>`}
const em=(i,t)=>`<div class=em><b>${i}</b>${t}</div>`,H=t=>`<div class=hd><h2>${t}</h2><button class=ic onclick="go('set')" aria-label="Impostazioni">⚙️</button></div>`;
/* --- Viste --- */
const V={
home(){const t=new Date(),P=cur(),h=t.getHours(),gr=h>=6&&h<18?'Buongiorno':'Buonasera',day=P&&P.days[t.getDay()],ss=db.sessions.filter(s=>wk(s.date)==wk(t)),W=new Set(db.sessions.map(s=>wk(s.date)));let st=0,q=new Date(t);if(!W.has(wk(q)))q.setDate(q.getDate()-7);while(W.has(wk(q))){st++;q.setDate(q.getDate()-7)}
const l=sorted()[0],wv=vs(ss),pw=vs(db.sessions.filter(s=>wk(s.date)==wk(new Date(t-6048e5)))),mo=db.sessions.filter(s=>s.date.slice(0,7)==iso(t).slice(0,7)),mon=new Date(wk(t)+'T12:00'),tr=new Set(db.sessions.map(s=>s.date)),
wd=[0,1,2,3,4,5,6].map(i=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const k=iso(d),pl=P&&P.days[d.getDay()];return`<div class="wd ${k==iso(t)?'td':''}"><span class=mu>${'LMMGVSD'[i]}</span><i class="${tr.has(k)?'ok':pl?'pl':''}"></i><span>${d.getDate()}</span></div>`}).join(''),
nx=[1,2,3,4,5,6,7].map(k=>{const d=new Date(t);d.setDate(t.getDate()+k);return[d,P&&P.days[d.getDay()]]}).filter(a=>a[1]).slice(0,3),
rc=sorted().flatMap(s=>s.ex.filter(x=>x.sets.some(y=>y.pr)).map(x=>[x.e,s.date,x.sets.filter(y=>y.pr).sort((a,b)=>b.w-a.w)[0]])).slice(0,3);
return H(gr+' Mattia!')+`<p class=mu style="margin-top:-8px">${GG[t.getDay()]} ${t.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}</p>
<div class="c hero">${db.live?`<h3>Allenamento in corso</h3><button class="wb big" onclick="go('wo')">Riprendi</button>`:!P?`<h3>Benvenuto</h3><p class=mu>L'app è vuota: crea la tua prima scheda e aggiungi gli esercizi.</p><button class="wb big" onclick="seg='plans';go('plan')">Crea la prima scheda</button>`:day?`<div class=mu>Oggi in programma · ${esc(P.name)}</div><h3 style="font-size:22px">${esc(day.name)}</h3><div class=mu>${day.ex.length} esercizi · ${day.ex.reduce((a,x)=>a+x.sets.length,0)} serie</div><br><button class="wb big" onclick="start(${t.getDay()})">Inizia allenamento</button>`:`<h3>Oggi riposo</h3><p class=mu>Recupera bene. Se vuoi, puoi allenarti comunque.</p><button class="wb big" onclick="start(-1)">Allenamento libero</button>`}</div>
<div class="c rg">${ring(ss.length/db.set.goal,'var(--ac)',ss.length+'/'+db.set.goal,'Settimana')}${ring(pw?wv/pw:wv?1:0,'var(--ok)',fm(wv),'Volume')}${ring(st/4,'#8a4dff',st,'Streak sett.')}</div>
<div class=c><h3>Questa settimana</h3><div class=wk>${wd}</div></div>
<div class=r style="margin-bottom:12px"><button onclick="start(-1)">Allenamento libero</button><button onclick="go('prog')">Misura il peso</button></div>
${nx.length?`<div class=c><h3>Prossimi allenamenti</h3>${nx.map(a=>`<div class=it><b>${GG[a[0].getDay()]}</b><span class=mu>${esc(a[1].name)}</span></div>`).join('')}</div>`:''}
${l?`<div class=c onclick="sd(${l.id})"><div class=mu>Ultimo allenamento</div><b>${esc(l.name)}</b><div class=mu>${l.date} · ${Math.round(l.dur/60)} min · ${fm(vol(l))} ${U()} · ${l.ex.length} esercizi</div></div>`:''}
${rc.length?`<div class=c><h3>Record recenti</h3>${rc.map(a=>`<div class=it><span>${esc(a[0])}</span><span class=pr>${a[2].w}${U()} × ${a[2].r}</span></div>`).join('')}</div>`:''}
<div class="c g"><div><b>${db.sessions.length}</b><span class=mu>allenamenti</span></div><div><b>${mo.length}</b><span class=mu>questo mese</span></div><div><b>${fm(vs(db.sessions))}</b><span class=mu>volume tot.</span></div></div>`},
wo(){const L=db.live;if(!L)return H('Allenamento')+em('🏋️','Nessun allenamento attivo')+`<button class="p big" onclick="start(-1)">Inizia allenamento libero</button>`;
return H(esc(L.name))+`<p class=mu id=el></p>`+L.ex.map((x,i)=>{const lt=last(x.e);return`<div class=c>${x.ss?'<span class=tg>🔗 Superset</span> ':''}<div class=r><h3>${esc(x.e)}</h3><button class="f0 ic" onclick="rep(${i})" aria-label="Sostituisci">⇄</button><button class="f0 ic d" onclick="rmEx(${i})" aria-label="Rimuovi">✕</button></div>${lt?`<div class=mu>Ultima volta: ${lt.map(y=>y.w+'×'+y.r).join(' · ')}</div>`:''}${x.sets.map((s,j)=>`<div class="s ${s.d?'dn':''}"><select style="padding:0;text-align:center" onchange="db.live.ex[${i}].sets[${j}].t=this.value;save()" aria-label="Tipo serie">${['N','R','D','C'].map(t=>`<option ${s.t==t?'selected':''}>${t}</option>`).join('')}</select><div class=st><button onclick="stp(${i},${j},'w',-2.5)">−</button><input inputmode="decimal" value="${s.w}" onchange="ed(${i},${j},'w',this.value)" aria-label="Peso"><button onclick="stp(${i},${j},'w',2.5)">+</button></div><div class=st><button onclick="stp(${i},${j},'r',-1)">−</button><input inputmode="numeric" value="${s.r}" onchange="ed(${i},${j},'r',this.value)" aria-label="Ripetizioni"><button onclick="stp(${i},${j},'r',1)">+</button></div><button class="${s.d?'p':''}" onclick="tg(${i},${j})" aria-label="Completa serie">✓</button></div>`).join('')}<div class=r><button onclick="addSet(${i})">+ Serie</button><button onclick="rmSet(${i})">− Serie</button></div><input placeholder="Note esercizio" value="${esc(x.note||'')}" onchange="db.live.ex[${i}].note=this.value;save()"></div>`}).join('')+`<p class=mu>Tipi serie: N normale · R riscaldamento · D drop-set · C cedimento</p><button class=big onclick="pick(n=>addEx(n))">+ Aggiungi esercizio</button><br><br><textarea placeholder="Note generali della sessione" onchange="db.live.note=this.value;save()">${esc(L.note||'')}</textarea><br><br><button class="p big" onclick="fin()">Termina allenamento</button><br><br><button class="big d" onclick="ask('Annullare e scartare questo allenamento?',()=>{db.live=null;save();go('home')},'Scarta')">Scarta allenamento</button>`},
plan(){let h=H('Scheda')+`<div class=seg><button class="${seg=='plans'?'on':''}" onclick="seg='plans';render()">Schede</button><button class="${seg=='lib'?'on':''}" onclick="seg='lib';render()">Esercizi</button></div>`;
if(seg=='lib')return h+`<button class="p big" onclick="pick(()=>render())">+ Nuovo esercizio</button><br><br>`+(db.lib.length?MU.map(m=>{const l=db.lib.map((x,i)=>[x,i]).filter(a=>a[0].m==m);return l.length?`<div class=c><h3>${m}</h3>${l.map(a=>`<div class=it><span>${esc(a[0].n)}</span><button class=d onclick="ask('Eliminare ${esc(a[0].n)} dalla libreria?',()=>{db.lib.splice(${a[1]},1);save();render()},'Elimina')">✕</button></div>`).join('')}</div>`:''}).join(''):em('📚','Nessun esercizio. Creane uno qui o mentre componi una scheda.'));

async function rem(){if(!('Notification' in window))return toast('Notifiche non supportate qui');try{if(await Notification.requestPermission()=='granted'){db.set.rem=1;save();new Notification('GymTracker',{body:'Promemoria attivo (quando l\'app è aperta).'})}else toast('Permesso negato')}catch(e){toast('Notifiche non disponibili')}}
setInterval(()=>{const e=$('#el');if(e&&db.live){const s=Math.floor((Date.now()-db.live.start)/1000);e.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},1000);
load();theme();render();
if(db.set.rem&&cur()&&cur().days[new Date().getDay()]&&!db.sessions.some(s=>s.date==iso())){try{new Notification('GymTracker',{body:'Oggi è giorno di allenamento: '+cur().days[new Date().getDay()].name})}catch(e){}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
